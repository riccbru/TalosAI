name: Deploy TalosAI

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy
    runs-on: [self-hosted, TalosAI]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env File
        run: |
          cat > .env <<EOF
          POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}

          DEV=${{ secrets.DEV }}
          BACKEND_PORT=${{ secrets.BACKEND_PORT }}
          JWT_ALG=${{ secrets.JWT_ALG }}
          REFRESH_TOKEN_EXPIRE_DAYS=${{ secrets.REFRESH_TOKEN_EXPIRE_DAYS }}
          ACCESS_TOKEN_EXPIRE_MINUTES=${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
          ACCESS_TOKEN_SECRET=${{ secrets.ACCESS_TOKEN_SECRET }}
          REFRESH_TOKEN_SECRET=${{ secrets.REFRESH_TOKEN_SECRET }}

          CREWAI_TRACING_ENABLED=${{ secrets.CREWAI_TRACING_ENABLED }}
          OLLAMA_BASE_URL=${{ secrets.OLLAMA_BASE_URL }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL=${{ secrets.GEMINI_MODEL }}
          PLANNER_MODEL=${{ secrets.PLANNER_MODEL }}
          SCANNER_MODEL=${{ secrets.SCANNER_MODEL }}
          TESTER_MODEL=${{ secrets.TESTER_MODEL }}
          SUMMARIZER_MODEL=${{ secrets.SUMMARIZER_MODEL }}
          CRITIC_MODEL=${{ secrets.CRITIC_MODEL }}
          REPORTER_MODEL=${{ secrets.REPORTER_MODEL }}
          EOF

      - name: Reset DB if DEV=true
        run: |
          if [ "${{ secrets.DEV }}" = "true" ]; then
            docker compose -f docker-compose.prod.yml down -v;
          fi

      - name: Build Docker images
        run: docker compose -f docker-compose.prod.yml build

      - name: Wait for DB if DEV=true
        run: |
          if [ "${{ secrets.DEV }}" = "true" ]; then
            docker compose -f docker-compose.prod.yml up -d db;
            until docker compose -f docker-compose.prod.yml exec -T db pg_isready -U postgres; do
              sleep 1;
            done;
          fi

      - name: Run Alembic migrations
        run: docker compose -f docker-compose.prod.yml run --rm backend alembic upgrade head

      - name: Seed DB if DEV=true
        run: |
          if [ "${{ secrets.DEV }}" = "true" ] && [ -f ~/seed.sql ]; then
            docker compose -f docker-compose.prod.yml cp ~/seed.sql db:/tmp/seed.sql;
            docker compose -f docker-compose.prod.yml exec -T db psql -U postgres -d talos_db -f /tmp/seed.sql;
            docker compose -f docker-compose.prod.yml exec -T db rm /tmp/seed.sql;
          fi

      - name: Deploy Containers
        run: docker compose -f docker-compose.prod.yml up -d