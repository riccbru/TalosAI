stages:
  - deploy

deploy_job:
  stage: deploy
  tags:
    - talosai-deploy
  only:
    - main
  script:
    - |
      cat > .env <<EOF
      POSTGRES_PORT=${POSTGRES_PORT}
      POSTGRES_DB=${POSTGRES_DB}
      POSTGRES_USER=${POSTGRES_USER}
      POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      DATABASE_URL=${DATABASE_URL}

      DEV=${DEV}
      BACKEND_PORT=${BACKEND_PORT}
      JWT_ALG=${JWT_ALG}
      REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS}
      ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
      REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
      
      CREWAI_TRACING_ENABLED=${CREWAI_TRACING_ENABLED}
      OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      GEMINI_API_KEY=${GEMINI_API_KEY}
      GEMINI_MODEL=${GEMINI_MODEL}
      PLANNER_MODEL=${PLANNER_MODEL}
      SCANNER_MODEL=${SCANNER_MODEL}
      TESTER_MODEL=${TESTER_MODEL}
      SUMMARIZER_MODEL=${SUMMARIZER_MODEL}
      CRITIC_MODEL=${CRITIC_MODEL}
      REPORTER_MODEL=${REPORTER_MODEL}
      EOF
    # Build images in background
    - docker compose -f docker-compose.prod.yml build
    # Alembic migration using new image
    - docker compose -f docker-compose.prod.yml run --rm talos_backend alembic upgrade head
    # Docker replaces only changed images
    - docker compose -f docker-compose.prod.yml up -d
