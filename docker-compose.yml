services:

  db:
    image: postgres:16-alpine
    container_name: talos_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      timeout: 3s
      interval: 3s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - talos_data            # internal-only; reachable solely by the backend

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    networks:
      - talos_network         # egress (Gemini/Ollama) + API
      - talos_data            # the ONLY service that reaches the db
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
    container_name: talos_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  # kali:
  #   image: vxcontrol/kali-linux:latest
  #   container_name: talos_kali
  #   # air-gapped: only on the (external) target network — see docker-compose.targets.yml.
  #   # Create it first:  docker network create --internal talos_targets
  #   networks:
  #     - talos_targets
  #   tty: true
  #   stdin_open: true
  #   command: tail -f /dev/null
  #   cap_add:
  #     - NET_ADMIN   # required: nmap binary is setcap'd with cap_net_admin (not in Docker's default caps)
  #     - NET_RAW     # raw sockets for SYN scans (in default caps, listed for clarity)
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: "2"
  #         memory: 4G

networks:
  # App/egress plane: backend only (serves the API, reaches Gemini/Ollama).
  talos_network:
    driver: bridge
    name: talos_network
  # Data plane: db + backend only, no Internet egress.
  talos_data:
    driver: bridge
    internal: true
    name: talos_data

volumes:
  postgres_data: