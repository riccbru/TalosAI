name: Deploy Targets

services:

  metasploitable2:
    tty: true
    stdin_open: true
    image: tleemcjr/metasploitable2
    container_name: talos_metasploitable2
    networks:
      - talos_targets
    command: >
      sh -c "/bin/services.sh && bash"

networks:
  talos_targets:
    external: true
    name: talos_targets
